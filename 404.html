<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0E0C09">
  <meta name="robots" content="noindex, follow">
  <meta name="author" content="Tatva Nirman Infra Pvt. Ltd.">
  <title>Page not found | Tatva Nirman Infra Pvt. Ltd.</title>

  <!-- Favicon: your real logo -->
  <link rel="icon" type="image/png" href="assets/img/logo-round.png">

  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,301,400,401,500,501,700,701,900,901&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="bg-watermark" aria-hidden="true"></div>
  <a class="skip-link" href="#main">Skip to main content</a>

  <!-- ==================================================================
       Static error page — served by nginx for any unmatched path
       (error_page 404 /404.html;). Header/footer are shared components
       filled in from content.js, same as every other page; only the
       middle "not found" panel is unique to this file. No auto-redirect
       on purpose — an automatic JS/meta-refresh redirect is jarring for
       visitors and can read as a "soft 404" to search engines. Instead
       there's a clear button back to the homepage.
       =================================================================== -->

  <header class="header" id="header"></header>

  <main id="main">
    <section class="section notfound" aria-label="Page not found">
      <div class="container notfound__in">
        <span class="notfound__code">404</span>
        <h1>This page doesn't exist</h1>
        <p>The link may be outdated, mistyped, or the page has moved. Here's how to get back on track.</p>
        <div class="notfound__actions">
          <a class="btn btn--primary" href="index.html">Go to homepage</a>
          <a class="btn btn--ghost" href="projects.html">View projects</a>
          <a class="btn btn--ghost" href="index.html#contact">Contact us</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer" id="footer"></footer>
  <div class="fab" id="fab"></div>

  <!-- 1. Content (edit this)  2. Shared renderer — header/footer only, no page-specific script needed -->
  <script src="assets/js/content.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    (function () {
      var TN = window.TN;
      if (!TN) return;
      TN.setSEO({ title: "Page not found | " + TN.C.company.name, description: "The page you're looking for doesn't exist." });
      TN.renderHeader();
      TN.renderFooter();
      TN.renderFab();
      TN.initCommonBehaviour();
    })();
  </script>
</body>
</html>
